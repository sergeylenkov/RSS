server {
  listen        9001;
  server_name   rss.local;

  root  /usr/share/nginx/html;
  index index.html;

  # SPA: unknown routes are handled by the client-side router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API: the client is built with a relative API URL, and nginx
  # forwards the calls to the `server` service of the compose file.
  location /feeds {
    proxy_pass       http://server:9000/feeds;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /entries {
    proxy_pass       http://server:9000/entries;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

